<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <linearGradient id="beefBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="beefShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#beefShadow)">
    <rect x="25" y="20" width="270" height="360" rx="16" fill="url(#beefBagGrad)" />
  </g>
  <rect x="25" y="20" width="270" height="24" rx="4" fill="#78350f" />
  <rect x="25" y="356" width="270" height="24" rx="4" fill="#78350f" />

  <!-- Retro Frame -->
  <rect x="40" y="55" width="240" height="290" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>

  <!-- Brand Headers -->
  <text x="160" y="90" text-anchor="middle" font-family="'Nanum Myeongjo', serif" font-weight="900" font-size="16" fill="#991b1b">1970 韓國 최초 쇠고기 국물</text>
  <text x="160" y="145" text-anchor="middle" font-family="'Nanum Myeongjo', serif" font-weight="900" font-size="34" fill="#78350f">삼양 쇠고기면</text>

  <!-- Illustration Bowl -->
  <circle cx="160" cy="225" r="55" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="160" cy="225" rx="45" ry="25" fill="#b45309"/>
  <path d="M135 220 Q160 210 185 220" stroke="#fef3c7" stroke-width="3" fill="none"/>
  <path d="M130 230 Q160 220 190 230" stroke="#fde68a" stroke-width="3" fill="none"/>

  <!-- Footer Tag -->
  <rect x="65" y="295" width="190" height="32" rx="16" fill="#b91c1c"/>
  <text x="160" y="316" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="13" fill="#ffffff">정통 소고기 장국 시원</text>
</svg>
